plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// ==================== 签名配置（从 CI 环境变量读取，绝不写死密码）====================
// CI 在 workflow 里还原 keystore 并设置这些环境变量：
//   KEYSTORE_PATH  = keystore 文件路径
//   KEY_ALIAS      = 别名
//   STORE_PASSWORD = 库密码
//   KEY_PASSWORD   = key 密码
// 本地没这些变量时自动回退到 debug 签名，不阻塞本地构建。

android {
    namespace 'com.godot.devassistant'
    compileSdk 34

    // NDK 27+ 的 libc++_shared.so 才是 16KB 页面对齐的
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.godot.devassistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters += ['arm64-v8a', 'armeabi-v7a', 'x86_64']
        }

        externalNativeBuild {
            cmake {
                // 链接参数（max-page-size）在 CMakeLists.txt 里用
                // target_link_options 设置，这里不要塞 CXX_FLAGS
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    // 只有 CI 提供了完整签名变量才创建 release 签名配置
    if (System.getenv("KEYSTORE_PATH") != null &&
        System.getenv("KEY_ALIAS") != null &&
        System.getenv("STORE_PASSWORD") != null &&
        System.getenv("KEY_PASSWORD") != null) {
        signingConfigs {
            release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                keyAlias System.getenv("KEY_ALIAS")
                storePassword System.getenv("STORE_PASSWORD")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有 release 签名配置就用它，否则回退到 debug 签名（本地构建）
            def releaseConfig = signingConfigs.findByName("release")
            signingConfig releaseConfig ?: signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            // .so 不压缩，由 AGP 做 16KB 对齐的 zipalign
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.6"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.6"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
